# Front-end de Alcanfores + proxy inverso hacia el API Gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Seguridad básica de cabeceras (el SSL lo pone Caddy delante)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /salud { access_log off; return 200 "ok"; }

    # API: todo lo que empieza con /api va al gateway de microservicios.
    # «^~» hace que esta regla gane a la de imágenes estáticas (las fotos de canchas son /api/catalogo/fotos/*.jpg).
    location ^~ /api/ {
        proxy_pass http://api-gateway:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Caddy (delante) ya pone en X-Forwarded-For SOLO la IP real del cliente e ignora la que este envíe;
        # se reenvía tal cual para que el limitador del gateway y la bitácora no puedan ser engañados.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 6m;
        proxy_read_timeout 60s;
    }

    # Archivos con hash de Vite: caché larga e inmutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imágenes estáticas (ilustraciones, marca): una semana
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA: React Router resuelve la ruta; index.html nunca se cachea (siempre la última versión)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
