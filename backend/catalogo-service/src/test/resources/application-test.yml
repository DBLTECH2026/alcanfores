# Perfil de pruebas: BD alcanfores_catalogo_test (MariaDB/MySQL local o el servicio MySQL de CI), sin RabbitMQ ni Eureka.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/alcanfores_catalogo_test?serverTimezone=America/Lima&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USUARIO:root}
    password: ${DB_CLAVE:}
  flyway:
    clean-disabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  cloud:
    discovery:
      enabled: false

management:
  health:
    rabbit:
      enabled: false

eureka:
  client:
    enabled: false

alcanfores:
  catalogo:
    uploads-dir: target/uploads-prueba
    semilla-fotos: true
