spring:
  application:
    name: pagos-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NOMBRE:alcanfores_pagos}?serverTimezone=America/Lima&useUnicode=true&characterEncoding=UTF-8
    username: ${DB_USUARIO:root}
    password: ${DB_CLAVE:}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Lima
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USUARIO:guest}
    password: ${RABBIT_CLAVE:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
  cloud:
    circuitbreaker:
      resilience4j:
        # El timeout lo pone el cliente HTTP (3 s); así la llamada corre en el mismo hilo y conserva el X-Request-Id.
        disable-time-limiter: true
        disable-thread-pool: true

server:
  port: ${PORT:8094}
  error:
    include-message: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  servicio: pagos-service
  descripcion: Pagos, Pasarela Alcanfores Pay (beta), Mercado Pago (sandbox) y comprobantes simulados

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

alcanfores:
  jwt:
    secreto: ${JWT_SECRETO:secreto-de-desarrollo-local-alcanfores-2026-cambiar-en-produccion}
    horas: ${JWT_HORAS:8}
  interno-token: ${INTERNO_TOKEN:token-interno-solo-para-desarrollo-local}
  front-url: ${FRONT_URL:http://localhost:5186}
  public-api-url: ${PUBLIC_API_URL:http://localhost:8086}
  semilla:
    habilitada: ${SEMILLA_HABILITADA:true}
  pagos:
    uploads-dir: ${UPLOADS_DIR:./uploads}
    pasarela:
      secreto: ${PASARELA_BETA_SECRETO:secreto-pasarela-beta-solo-para-desarrollo-local}
      # Vacío = el propio servicio: http://localhost:{puerto}/api/webhooks/pasarela-beta
      url-webhook: ${PASARELA_BETA_WEBHOOK_URL:}
      minutos-expiracion: 15
    mercadopago:
      access-token: ${MP_ACCESS_TOKEN:}
      webhook-secreto: ${MP_WEBHOOK_SECRETO:}
      url-api: ${MP_URL_API:https://api.mercadopago.com}

logging:
  pattern:
    level: "%5p [%X{idSolicitud:-}]"
