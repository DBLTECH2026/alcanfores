spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/alcanfores_auth_test?serverTimezone=America/Lima&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

management:
  health:
    rabbit:
      enabled: false

alcanfores:
  auth:
    # BCrypt más liviano solo en pruebas (en producción es 12).
    bcrypt-fuerza: 4
    semilla:
      habilitada: false
